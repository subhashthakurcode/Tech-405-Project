<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather AI | Sign In & Register</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-bottom"></div>
    <div class="grid-overlay"></div>

    <main class="auth-wrapper">
        <div class="auth-card">
            
            <!-- Branding Header -->
            <div class="auth-header">
                <div class="brand-badge">
                    <i data-lucide="cloud-sun"></i>
                </div>
                <h1 id="auth-title">Welcome Back</h1>
                <p id="auth-subtitle">Sign in to your European Weather AI account</p>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tab-login">
                    <i data-lucide="log-in" style="width: 15px; height: 15px;"></i>
                    <span>Sign In</span>
                </button>
                <button type="button" class="auth-tab-btn" id="tab-signup">
                    <i data-lucide="user-plus" style="width: 15px; height: 15px;"></i>
                    <span>Sign Up</span>
                </button>
            </div>

            <!-- TAB 1: LOGIN FORM -->
            <form class="auth-form active" id="form-login">
                <div class="form-field">
                    <label class="field-label" for="login-email">
                        <i data-lucide="mail" style="width: 13px; height: 13px;"></i>
                        Email Address
                    </label>
                    <div class="input-box">
                        <i data-lucide="at-sign" class="field-icon"></i>
                        <input type="email" id="login-email" placeholder="user@example.com" value="subhash@weatherai.org" required>
                    </div>
                </div>

                <div class="form-field">
                    <label class="field-label" for="login-password">
                        <i data-lucide="lock" style="width: 13px; height: 13px;"></i>
                        Password
                    </label>
                    <div class="input-box">
                        <i data-lucide="key" class="field-icon"></i>
                        <input type="password" id="login-password" placeholder="••••••••••••" value="demo1234" required>
                        <button type="button" class="toggle-pwd" data-target="login-password" title="Toggle password view">
                            <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="check-label">
                        <input type="checkbox" id="login-remember" checked>
                        <span>Remember me</span>
                    </label>
                    <a href="javascript:void(0)" class="inline-link" id="link-forgot">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn" id="btn-login-submit">
                    <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
                    <span>Sign In to Dashboard</span>
                </button>

                <!-- Quick One-Click Demo Chip -->
                <div class="demo-tip-card" id="btn-fill-demo" title="Click to autofill demo credentials">
                    <div class="demo-tip-text">
                        <strong>Demo Credentials:</strong><br>
                        subhash@weatherai.org · demo1234
                    </div>
                    <span class="demo-chip-action">Auto Fill</span>
                </div>

                <div class="or-divider"><span>Or continue with</span></div>

                <div class="social-buttons">
                    <button type="button" class="social-btn" id="btn-google">
                        <i data-lucide="globe" style="width: 15px; height: 15px; color: #38bdf8;"></i>
                        <span>Google</span>
                    </button>
                    <button type="button" class="social-btn" id="btn-github">
                        <i data-lucide="code" style="width: 15px; height: 15px; color: #a78bfa;"></i>
                        <span>GitHub</span>
                    </button>
                </div>
            </form>

            <!-- TAB 2: SIGN UP FORM -->
            <form class="auth-form" id="form-signup">
                <div class="form-field">
                    <label class="field-label" for="signup-name">
                        <i data-lucide="user" style="width: 13px; height: 13px;"></i>
                        Full Name
                    </label>
                    <div class="input-box">
                        <i data-lucide="user-check" class="field-icon"></i>
                        <input type="text" id="signup-name" placeholder="Subhash Thakur" required>
                    </div>
                </div>

                <div class="form-field">
                    <label class="field-label" for="signup-email">
                        <i data-lucide="mail" style="width: 13px; height: 13px;"></i>
                        Email Address
                    </label>
                    <div class="input-box">
                        <i data-lucide="at-sign" class="field-icon"></i>
                        <input type="email" id="signup-email" placeholder="name@weatherai.org" required>
                    </div>
                </div>

                <div class="form-field">
                    <label class="field-label" for="signup-password">
                        <i data-lucide="lock" style="width: 13px; height: 13px;"></i>
                        Create Password
                    </label>
                    <div class="input-box">
                        <i data-lucide="key" class="field-icon"></i>
                        <input type="password" id="signup-password" placeholder="At least 6 characters" required>
                        <button type="button" class="toggle-pwd" data-target="signup-password" title="Toggle password view">
                            <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
                        </button>
                    </div>
                </div>

                <div class="form-field">
                    <label class="field-label" for="signup-confirm-password">
                        <i data-lucide="shield-check" style="width: 13px; height: 13px;"></i>
                        Confirm Password
                    </label>
                    <div class="input-box">
                        <i data-lucide="check" class="field-icon"></i>
                        <input type="password" id="signup-confirm-password" placeholder="Repeat password" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="check-label">
                        <input type="checkbox" id="signup-terms" checked required>
                        <span>I accept terms & climate privacy policy</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" id="btn-signup-submit">
                    <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i>
                    <span>Create Free Account</span>
                </button>
            </form>

        </div>

        <!-- Back to Live Dashboard -->
        <div class="back-center">
            <a href="index.html" class="back-link">
                <i data-lucide="arrow-left" style="width: 15px; height: 15px;"></i>
                <span>Continue as Guest / Return to Dashboard</span>
            </a>
        </div>
    </main>

    <!-- Floating Feedback Toast -->
    <div class="toast-notice" id="toast-notice">
        <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
        <span id="toast-text">Signed in successfully!</span>
    </div>

    <script src="auth.js"></script>
</body>
</html>
